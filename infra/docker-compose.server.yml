# Lean production stack for single-VM deploy.
# Run from the infra/ directory:  docker compose -f docker-compose.server.yml up -d
# Reads ./.env for secrets and ${VAR} interpolation.
name: lesovik

services:
  postgres:
    image: postgres:16-alpine
    container_name: lesovik-postgres
    networks:
      - default
      - sandbox_net
    environment:
      POSTGRES_DB: nocode
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d nocode"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lesovik-redis
    networks:
      - default
      - sandbox_net
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: lesovik-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    restart: unless-stopped

  clamav:
    image: clamav/clamav:1.4
    container_name: lesovik-clamav
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      # First start downloads ~300 MB of signatures — allow up to 10 minutes
      start_period: 600s
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    container_name: lesovik-backend
    command: >
      gunicorn app.main:app
        -k uvicorn.workers.UvicornWorker
        -w 4 --bind 0.0.0.0:8000 --timeout 120 --access-logfile -
    env_file: .env
    environment:
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      clamav:
        condition: service_started
    ports:
      - "127.0.0.1:8001:8000"   # localhost-only, for debugging
    restart: unless-stopped

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    container_name: lesovik-worker
    command: >
      celery -A app.worker.celery_app worker
        --loglevel=info --concurrency=4
        --queues=default,notifications,exports
    env_file: .env
    environment:
      APP_ENV: production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      clamav:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  sandbox-worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      target: runtime
    container_name: lesovik-sandbox-worker
    command: >
      celery -A app.worker.celery_app worker
        --loglevel=info --concurrency=2
        --queues=sandbox
    # Attached ONLY to sandbox_net (internal: true, see bottom of file) — no
    # route to the internet or to any other container. Rule execution is
    # pure in-process AST interpretation over Postgres; any email/webhook a
    # rule computes is queued for the regular `worker` container to send
    # (app/worker/tasks/sandbox.py::_persist_batch), so this process itself
    # never needs to make an outbound HTTP call.
    networks:
      - sandbox_net
    env_file: .env
    environment:
      APP_ENV: production
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker.celery_app inspect ping --timeout=5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      target: runtime
    container_name: lesovik-frontend
    depends_on:
      - backend
    ports:
      - "8090:80"
    restart: unless-stopped

networks:
  default: {}
  # internal: true — Docker sets up no gateway/NAT for this network, so a
  # container attached only here has no route to the internet, the host,
  # or any other container network. Only postgres/redis (dual-homed above)
  # and sandbox-worker sit on it.
  sandbox_net:
    internal: true

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamavdata:
